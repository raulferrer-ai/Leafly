
name: CI

on:
  push:
    branches: [main, "harness-*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  harness:
    name: Harness check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: |
          chmod +x init.sh
          chmod +x scripts/verify-feature.sh

      - name: Run init.sh
        run: ./init.sh

  android:
    name: Android unit tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

  ios:
    name: iOS build
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Build iOS
        working-directory: ios/Leafly
        run: |
          xcodebuild build \
            -project Leafly.xcodeproj \
            -scheme Leafly \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
