name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  harness:
    name: Harness check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: |
          chmod +x init.sh scripts/verify-feature.sh scripts/selftest-gate.sh

      - name: Run init.sh
        run: ./init.sh

      - name: Validate board and specs
        run: ./scripts/verify-feature.sh --check-board

      - name: Run gate selftest
        run: ./scripts/selftest-gate.sh

      - name: No IDE or user files tracked in git
        run: |
          if git ls-files | grep -E '(^|/)(xcuserdata|\.idea)(/|$)|\.xcuserstate$|(^|/)\.DS_Store$|(^|/)local\.properties$'; then
            echo "Found IDE or user-specific files tracked in git" >&2
            exit 1
          fi

  android:
    name: Android unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android sensor
        run: |
          chmod +x scripts/verify-feature.sh
          make sensor-android

  ios:
    name: iOS tests
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Verify simulator from Makefile exists
        run: make check-sim

      - name: Run iOS sensor
        run: |
          chmod +x scripts/verify-feature.sh
          make sensor-ios

  gate:
    name: Gate
    runs-on: ubuntu-latest
    needs: [harness, android, ios]

    steps:
      - uses: actions/checkout@v4
      - run: echo "All required checks (harness, android, ios) passed."